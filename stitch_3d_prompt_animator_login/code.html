<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PromptCoroner - Login</title>
<!-- FontAwesome for icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // Setup 3D Background Particle Field
  const bgInit = () => {
    const container = document.getElementById('bg-canvas');
    const scene = new THREE.Scene();
    
    // Add subtle ambient fog matching background
    scene.fog = new THREE.FogExp2(0x0B0D13, 0.001);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.z = 1000;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Create particles
    const geometry = new THREE.BufferGeometry();
    const particlesCount = 1500;
    const posArray = new Float32Array(particlesCount * 3);
    const colorArray = new Float32Array(particlesCount * 3);

    const color1 = new THREE.Color('#7F75F8');
    const color2 = new THREE.Color('#5587F7');

    for(let i = 0; i < particlesCount * 3; i+=3) {
      // Spread particles widely
      posArray[i] = (Math.random() - 0.5) * 3000;
      posArray[i+1] = (Math.random() - 0.5) * 3000;
      posArray[i+2] = (Math.random() - 0.5) * 2000;

      // Mix colors
      const mixedColor = color1.clone().lerp(color2, Math.random());
      colorArray[i] = mixedColor.r;
      colorArray[i+1] = mixedColor.g;
      colorArray[i+2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

    const material = new THREE.PointsMaterial({
      size: 4,
      vertexColors: true,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending
    });

    const particlesMesh = new THREE.Points(geometry, material);
    scene.add(particlesMesh);

    // Mouse Interaction
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;

    const windowHalfX = window.innerWidth / 2;
    const windowHalfY = window.innerHeight / 2;

    document.addEventListener('mousemove', (event) => {
      mouseX = (event.clientX - windowHalfX);
      mouseY = (event.clientY - windowHalfY);
    });

    // Handle Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const animate = () => {
      requestAnimationFrame(animate);

      targetX = mouseX * 0.1;
      targetY = mouseY * 0.1;

      particlesMesh.rotation.y += 0.001;
      particlesMesh.rotation.x += 0.0005;

      // Smooth camera movement
      camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.02;
      camera.position.y += (-mouseY * 0.5 - camera.position.y) * 0.02;
      camera.lookAt(scene.position);

      renderer.render(scene, camera);
    };

    animate();
  };

  // Setup 3D Centerpiece
  const centerpieceInit = () => {
    const container = document.getElementById('centerpiece-canvas');
    const width = container.clientWidth;
    const height = container.clientHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Create a faceted diamond / octahedron shape
    const geometry = new THREE.OctahedronGeometry(1.5, 0);
    
    // Tech-noir wireframe + solid material setup
    const material = new THREE.MeshStandardMaterial({
      color: 0x5587F7,
      emissive: 0x2A1B6A,
      emissiveIntensity: 0.5,
      roughness: 0.2,
      metalness: 0.8,
      flatShading: true,
      transparent: true,
      opacity: 0.9
    });

    const mesh = new THREE.Mesh(geometry, material);
    
    // Add wireframe overlay for investigative tech look
    const wireframeMaterial = new THREE.MeshBasicMaterial({
      color: 0x7F75F8,
      wireframe: true,
      transparent: true,
      opacity: 0.4
    });
    const wireframe = new THREE.Mesh(geometry, wireframeMaterial);
    mesh.add(wireframe);

    // --- Scanning Light Beam Effect ---
    const beamGeometry = new THREE.CylinderGeometry(1.6, 1.6, 0.05, 32);
    const beamMaterial = new THREE.MeshBasicMaterial({
      color: 0x8774f9,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    });
    const scanBeam = new THREE.Mesh(beamGeometry, beamMaterial);
    scanBeam.rotation.x = Math.PI / 2;
    mesh.add(scanBeam);

    scene.add(mesh);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x7F75F8, 2);
    pointLight.position.set(2, 3, 4);
    scene.add(pointLight);

    const pointLight2 = new THREE.PointLight(0x5587F7, 2);
    pointLight2.position.set(-2, -3, 2);
    scene.add(pointLight2);

    const animate = () => {
      requestAnimationFrame(animate);
      
      const time = Date.now() * 0.001;

      // Smooth rotation
      mesh.rotation.y += 0.01;
      mesh.rotation.x += 0.005;
      
      // Gentle floating
      mesh.position.y = Math.sin(time * 2) * 0.15;

      // Scan beam movement
      // Cycle between -1.5 and 1.5 height
      scanBeam.position.y = Math.sin(time * 1.5) * 1.6;
      // Pulse opacity
      scanBeam.material.opacity = 0.4 + Math.sin(time * 3) * 0.4;

      renderer.render(scene, camera);
    };

    animate();
  };

  // Initialize both
  window.addEventListener('load', () => {
    bgInit();
    centerpieceInit();
  });
</script>
